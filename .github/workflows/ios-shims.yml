# Builds the iOS shim libraries (shims/build.sh ios) on a GitHub-hosted Mac, with the local patches in
# patches/*.patch applied first (touch-controls.patch: Slashplayed's touch stick and buttons).
# Run by hand: Actions > Build iOS shims > Run workflow. The artifact holds build/ios/: every
# libsp*.dylib and exports.json, unsigned; slashplayed-companion signs them when it installs the kit.
name: Build iOS shims
 
on:
  workflow_dispatch:
 
permissions:
  contents: read
 
jobs:
  build:
    # The image the project's own CI builds the shims on (.github/workflows/ci.yml).
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      XCODE_APP: /Applications/Xcode_27.1.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
 
      - name: Select Xcode 27.1
        run: sudo xcode-select -s "$XCODE_APP"
 
      - name: Apply local patches (patches/*.patch)
        run: |
          set -euo pipefail
          shopt -s nullglob
          for p in patches/*.patch; do
            echo "applying $p"
            git apply --verbose "$p"
          done
 
      - name: Build the shims for iOS
        run: shims/build.sh ios
 
      - name: Show the result
        run: |
          ls -l build/ios
          shasum -a 256 build/ios/*.dylib build/ios/exports.json
 
      - uses: actions/upload-artifact@v4
        with:
          name: ios-shims
          path: build/ios/
          if-no-files-found: error
          retention-days: 30
 
